    <script>
      (function() {
        // Fix: "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // Ensure window.fetch has both a getter and a setter so extension/executor scripts can safely wrap or override it
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(fn) {
                  _protoFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Intercept and prevent extension-injected errors from breaking the web application
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message && (
              event.message.includes('Cannot set property fetch') ||
              event.message.includes('has only a getter')
            ))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            typeof event.reason.message === 'string' &&
            (
              event.reason.message.includes('Cannot set property fetch') ||
              event.reason.message.includes('has only a getter') ||
              event.reason.message.includes('chrome-extension://')
            )
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
